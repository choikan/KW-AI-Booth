<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>D · 찐융 VS 짭융 · 2026 KW Epilogue: AI Booth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/common.css">
<link rel="icon" href="../assets/img/logo-blue.png">
<style>
:root{box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px);}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg) radial-gradient(1200px 380px at 50% -120px,var(--violet-soft),transparent);color:var(--ink);
  font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:16px;line-height:1.55;
  -webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
h1,h2,h3,.jua,button{font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-weight:400}
h1{font-size:2.4rem;line-height:1.1;margin:0}
h2{font-size:1.6rem;line-height:1.2;margin:0 0 8px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.screen{display:none}
.screen.on{display:block}
button{border:2.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:1.15rem;
  padding:12px 18px;border-radius:999px;cursor:pointer;box-shadow:0 3px 0 var(--line);transition:transform .08s, box-shadow .08s}
button:active{transform:translateY(3px);box-shadow:0 0 0 var(--line)}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
button.primary{background:var(--grad);color:#fff}
button.ghost{border:none;box-shadow:none;background:none;text-decoration:underline;font-size:1rem;padding:8px}
button:disabled{opacity:.45;cursor:not-allowed}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;background:var(--grad);color:#fff;border-radius:999px;padding:3px 14px;font-family:"Jua",sans-serif;font-size:1rem}

/* hero */
.hero{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:8px;margin:12px 0 16px}
.hero img{width:100%;height:auto;display:block;border-radius:24px;background:#fff;border:2.5px solid var(--line)}
.vs span:first-child{color:var(--blue)}
.vs span:last-child{color:var(--violet)}
.vs{font-size:3.2rem;line-height:.95;letter-spacing:-.02em;text-align:center}
.herotext{display:flex;flex-direction:column;align-items:center}
.vs span{display:block}
.vs .v{font-size:1.4rem;color:var(--muted)}

/* level select */
.lvsel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 8px}
.lvsel button{padding:10px 4px;font-size:1.3rem;border-radius:16px}
.lvsel button[aria-pressed="true"]{background:var(--blue);color:#fff}
.lvdesc{font-size:.95rem;color:var(--muted);min-height:1.6em}

/* play */
.hud{position:sticky;top:calc(52px + env(safe-area-inset-top,0px));z-index:5;background:var(--bg);padding:8px 0 10px}
.hudrow{display:flex;justify-content:space-between;align-items:center;font-family:"Jua",sans-serif;font-size:1.1rem}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  font-family:"Jua",sans-serif;padding:10px 18px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
.hintbox{border:2.5px solid var(--line);border-radius:18px;padding:16px;background:var(--surface);margin:12px 0}
label{display:block;font-family:"Jua",sans-serif;margin-bottom:4px}
input{width:100%;font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.rec{font-family:"Jua",sans-serif;font-size:3rem;line-height:1}
table{border-collapse:collapse;width:100%}
td,th{padding:6px 4px;border-bottom:1px solid var(--soft);text-align:left}
tr.me td{font-weight:700;color:var(--blue)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.stage{position:relative;width:min(100%,520px);margin:0 auto}
.grid{display:grid;gap:3px;background:var(--surface);border:2.5px solid var(--line);border-radius:18px;padding:6px;aspect-ratio:1/1}
.grid .cell{position:relative;display:flex;align-items:center;justify-content:center;border-radius:6px;background:#fff;overflow:hidden}
.grid .cell img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none}
.grid.tap .cell{cursor:pointer}
.grid .cell.ok{box-shadow:inset 0 0 0 3px var(--ok);background:var(--ok-soft)}
.grid .cell.no{box-shadow:inset 0 0 0 3px var(--bad)}
.grid.small{gap:2px;padding:4px;border-radius:12px}
.grid.small .cell{border-radius:3px}
.cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:18px;border:2.5px solid var(--line);background:var(--surface);font-family:"Jua",sans-serif;text-align:center;padding:16px}
.cover .big{font-size:5rem;line-height:1}
.cover .sub{font-size:1.2rem;color:var(--muted)}
.answer{margin-top:14px}
.ansview{font-family:"Jua",sans-serif;font-size:2.6rem;text-align:center;border:2.5px solid var(--line);border-radius:16px;background:var(--surface);padding:6px;min-height:68px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pad button{padding:12px 0;font-size:1.5rem;border-radius:14px}
.pad button.go{background:var(--blue);color:#fff}
.rounds{display:flex;gap:6px}
.rounds b{flex:1;height:10px;border-radius:999px;border:2px solid var(--line);background:var(--surface)}
.rounds b.done{background:var(--ok)}
.rounds b.now{background:var(--violet)}
.bar{height:14px;border-radius:999px;background:var(--soft);border:2px solid var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--blue);width:100%}
.bar.low i{background:var(--bad)}
.timer{font-family:"Jua",sans-serif;font-size:1.6rem;line-height:1}
.timer.low{color:var(--bad)}
.cover img{width:120px;height:120px;border-radius:16px;border:2px solid var(--line);background:#fff}
.bubble{position:relative;background:var(--surface);border:2.5px solid var(--line);border-radius:18px;padding:10px 12px;font-family:"Jua",sans-serif;font-size:1.05rem;line-height:1.35;margin:0 0 14px 6px;text-align:center;align-self:stretch}
.bubble::after{content:"";position:absolute;left:-9px;top:22px;width:14px;height:14px;background:var(--surface);border-left:2.5px solid var(--line);border-bottom:2.5px solid var(--line);transform:rotate(45deg)}
</style>
</head>
<body>
<header class="kw-bar"><div class="kw-bar-in">
  <a class="kw-home" href="../"><img src="../assets/img/logo-white.png" alt="하성 로고"><span>AI Booth<small>인공지능융합대학 학생회 하성</small></span></a>
  <span class="kw-zone"><b>D</b>찐융 VS 짭융</span>
  <a class="kw-all" href="../">전체 체험</a>
</div></header>
<div class="wrap">

<section class="screen" id="s-home">
  <span class="tag">2026 KW Epilogue: AI Booth</span>
  <div class="hero"><img class="heroImg" alt="공식 마스코트 찐융"><div class="herotext"><div class="bubble">나는 코융이야!<br>시작 전에 내 모습을 잘 기억해둬~</div><h1 class="vs"><span>찐융</span><span class="v">VS</span><span>짭융</span></h1></div></div>
  <p>조금씩 다른 <b>짭융</b> 사이에서 진짜 <b>찐융</b>을 찾아보세요.</p>
  <label>난이도</label>
  <div class="lvsel" id="lvSel" role="group" aria-label="난이도 선택"></div>
  <p class="lvdesc" id="lvDesc"></p>
  <div class="stack" style="margin-top:8px">
    <button class="primary" id="btnCount">START</button>
    <button id="btnRecord">CHALLENGE</button>
    <button id="btnRank">RANKING</button>
  </div>
</section>

<section class="screen" id="s-play">
  <div class="hud">
    <div class="hudrow"><span id="roundLabel">ROUND 1 · 3×3</span><span id="hudRight"></span></div>
    <div class="rounds" id="roundBar" style="margin-top:8px"></div>
    <div class="hudrow" style="margin-top:10px"><span>남은 시간</span><span class="timer" id="timeText">0초</span></div>
    <div class="bar" id="timeBarWrap"><i id="timeBar"></i></div>
  </div>
  <div class="stage">
    <div class="grid" id="grid"></div>
    <div class="cover" id="cover"><img id="coverImg" alt="찐융" hidden><div class="big" id="coverBig">3</div><div class="sub" id="coverSub">찐융이 몇 마리일까요?</div></div>
  </div>
  <div class="answer" id="answer" hidden>
    <p class="jua" style="font-size:1.3rem;margin-bottom:6px;text-align:center">방금 찐융은 몇 마리였나요?</p>
    <div class="ansview" id="ansView" aria-live="polite"></div>
    <div class="pad" id="pad"></div>
  </div>
</section>

<section class="screen" id="s-fail">
  <h2>아쉬워요!</h2>
  <p id="failMsg"></p>
  <div class="stack"><button class="primary" id="btnRetry">다시 하기</button><button data-go="home">처음으로</button></div>
</section>

<section class="screen" id="s-clear">
  <h2 id="clearTitle">클리어!</h2>
  <p id="clearMsg"></p>
  <div class="stack"><button class="primary" id="btnNextLv">다음 난이도</button><button id="btnCountAgain">다시 하기</button><button data-go="home">처음으로</button></div>
</section>

<section class="screen" id="s-recform">
  <h2>기록 도전</h2>
  <p id="recRule"></p>
  <div class="stack" style="margin:14px 0">
    <div><label for="fName">이름</label><input id="fName" maxlength="10" autocomplete="off"></div>
    <div><label for="fPhone">전화번호</label><input id="fPhone" type="tel" inputmode="numeric" maxlength="13" autocomplete="off" placeholder="010-0000-0000"></div>
    <label class="row" style="font-family:'Gowun Dodum',sans-serif;font-size:.92rem;align-items:flex-start;gap:8px"><input id="fAgree" type="checkbox" style="width:auto;margin-top:4px"><span>이름과 전화번호를 상품 안내 연락에만 쓰는 데 동의해요. 이 기기에만 저장되고, 순위표에는 가려서 보여요.</span></label>
  </div>
  <div class="stack"><button class="primary" id="btnRecStart">시작</button><button data-go="home">처음으로</button></div>
</section>

<section class="screen" id="s-recplay">
  <div class="hud">
    <div class="hudrow"><span id="recLeft">남은 찐융</span><span id="recClock">0.00초</span></div>
  </div>
  <div class="stage">
    <div class="grid tap" id="recGrid"></div>
    <div class="cover" id="recCover"><div class="big" id="recCoverBig">3</div><div class="sub" id="recCoverSub">찐융을 모두 찾아요</div></div>
  </div>
</section>

<section class="screen" id="s-recres">
  <h2 id="recTitle">기록 도전 완료</h2>
  <div class="rec" id="recTime">0.00초</div>
  <p class="muted" id="recDetail" style="margin-top:8px"></p>
  <div class="hintbox"><table id="recTable"></table></div>
  <div class="stack"><button class="primary" id="btnRecAgain">다시 하기</button><button data-go="home">처음으로</button></div>
</section>

<section class="screen" id="s-rank">
  <h2>기록 도전 순위</h2>
  <p class="muted">한 사람당 최고 기록만 보여요.</p>
  <div class="hintbox"><table id="rankTable"></table></div>
  <div class="stack"><button data-go="home">처음으로</button></div>
  <div class="hintbox" style="margin-top:24px">
    <label for="aPin">운영진</label>
    <div class="row" style="flex-wrap:nowrap"><input id="aPin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN"><button type="button" id="btnAdmin" style="white-space:nowrap">연락처 보기</button></div>
    <button class="ghost" id="btnReset" hidden>기록 지우기</button>
  </div>
</section>

</div>

/* ===== 난이도 설정 ===== */
const EASY = ["earL","tail","collar","stripe"], MID = EASY.concat(["nose","cheekR","string"]), HARD = MID.concat(["pendant","eyehl"]);
const LEVELS = {
  1:{name:"하", sec:30, desc:"4×4 · 30초",
     rounds:[{n:4,min:2,max:6,pool:EASY},{n:4,min:3,max:7,pool:EASY},{n:4,min:3,max:8,pool:EASY}]},
  2:{name:"중", sec:20, desc:"4×4 · 20초",
     rounds:[{n:4,min:3,max:7,pool:EASY},{n:4,min:3,max:8,pool:MID},{n:4,min:4,max:9,pool:MID,vary:true}]},
  3:{name:"상", sec:10, desc:"4×4 · 10초",
     rounds:[{n:4,min:3,max:8,pool:MID,vary:true},{n:4,min:4,max:9,pool:HARD,vary:true},{n:4,min:4,max:10,pool:HARD,vary:true}]}
};
const ADMIN_PIN = "2026"; // 순위 화면에서 실명·전화번호를 볼 때 쓰는 PIN. 원하는 숫자로 바꿔도 돼요.
const REC = {n:10, target:10, pool:EASY}; // 기록 도전: 10×10에서 찐융 10마리 찾기
const PENALTY = 2; // 기록 도전: 짭융을 잘못 누르면 더해지는 초

/* ===== 기기에 저장 ===== */
const KEY="jjj-booth-v1";
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
let S=load(); S.lv=S.lv||1; S.board=S.board||[]; delete S.name; delete S.recs;
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ===== 공통 ===== */
const $=s=>document.querySelector(s);
const renders={};
function show(id){ document.querySelectorAll(".screen").forEach(e=>e.classList.toggle("on", e.id==="s-"+id)); window.scrollTo(0,0); if(renders[id]) renders[id](); }
function goHome(){ abortAll(); adminOn=false; show("home"); }
document.addEventListener("click", e=>{ const g=e.target.closest("[data-go]"); if(!g) return; if(g.dataset.go==="home") return goHome(); abortAll(); show(g.dataset.go); });
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("on"); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("on"),1200); }
const wait=ms=>new Promise(r=>setTimeout(r,ms));
let runId=0, recRaf=0; function abortAll(){ runId++; cancelAnimationFrame(recRaf); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function rint(min,max){ return min+Math.floor(Math.random()*(max-min+1)); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function esc(t){ return String(t).replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch])); }

/* ===== 이미지 (찐융 + 짭융 변형) ===== */
const IMG={};
function loadImg(src){ return new Promise(r=>{ const im=new Image(); im.onload=()=>r(im); im.onerror=()=>r(im); im.src=src; }); }
let imgReady=null;
function buildImages(){
  if(imgReady) return imgReady;
  imgReady=(async()=>{
    const base=await loadImg(ASSETS.base); const S2=220, k=S2/600;
    for(const d of ASSETS.diffs){ d._im=await loadImg(d.img); }
    const make=(id)=>{ const c=document.createElement("canvas"); c.width=c.height=S2; const x=c.getContext("2d");
      x.fillStyle="#fff"; x.fillRect(0,0,S2,S2); x.drawImage(base,0,0,S2,S2);
      if(id){ const d=ASSETS.diffs.find(v=>v.id===id); x.drawImage(d._im, d.x*k, d.y*k, d.w*k, d.h*k); }
      return c.toDataURL("image/png"); };
    IMG.real=make(null); ASSETS.diffs.forEach(d=>IMG[d.id]=make(d.id));
  })();
  return imgReady;
}
document.querySelectorAll(".heroImg").forEach(i=>i.src=ASSETS.base);
function cellHTML(src, vary){
  let t="";
  if(vary){ const flip=Math.random()<.5?-1:1, sc=(0.78+Math.random()*0.22).toFixed(2); t=`style="transform:scale(${flip*sc},${sc})"`; }
  return `<div class="cell"><img src="${src}" alt="" ${t}></div>`;
}

/* ===== 홈: 난이도 선택 ===== */
renders.home=()=>{
  $("#lvSel").innerHTML=[1,2,3].map(l=>`<button type="button" data-lv="${l}" aria-pressed="${S.lv===l}">${LEVELS[l].name}</button>`).join("");
  $("#lvSel").querySelectorAll("button").forEach(b=>b.onclick=()=>{ S.lv=+b.dataset.lv; save(); renders.home(); });
  $("#lvDesc").textContent=LEVELS[S.lv].desc;
};

/* ===== 찐융 세기 ===== */
let P=null;
function renderRoundBar(){ const R=LEVELS[P.lv].rounds; $("#roundBar").innerHTML=R.map((_,i)=>`<b class="${i<P.r?"done":i===P.r?"now":""}"></b>`).join(""); }
async function startCount(){
  await buildImages();
  P={r:0, lv:S.lv}; playRound();
}
async function playRound(){
  const L=LEVELS[P.lv], my=++runId, R=L.rounds[P.r], cells=R.n*R.n;
  const count=rint(R.min, Math.min(R.max, cells-1));
  const kinds=shuffle(Array(cells).fill(null).map((_,i)=> i<count ? "real" : pick(R.pool)));
  P.answer=count; P.input="";
  show("play"); renderRoundBar();
  $("#roundLabel").textContent=`ROUND ${P.r+1}/${L.rounds.length} · ${R.n}×${R.n}`;
  $("#hudRight").textContent=`난이도 ${L.name} · ${L.sec}초`;
  const g=$("#grid"); g.className="grid"; g.style.gridTemplateColumns=`repeat(${R.n},1fr)`;
  g.innerHTML=kinds.map(k=>cellHTML(k==="real"?IMG.real:IMG[k], R.vary)).join("");
  $("#answer").hidden=true;
  const cover=$("#cover"), cimg=$("#coverImg"); cover.hidden=false; cimg.src=IMG.real; cimg.hidden=false;
  $("#coverSub").textContent=`이 찐융을 ${L.sec}초 동안 세어 보세요`;
  setTimer(L.sec, L.sec);
  for(const n of [3,2,1]){ $("#coverBig").textContent=n; await wait(800); if(my!==runId) return; }
  cover.hidden=true;
  const dur=L.sec*1000, t0=performance.now();
  await new Promise(res=>{ const tick=()=>{ if(my!==runId) return res();
    const left=Math.max(0, dur-(performance.now()-t0)); setTimer(left/1000, L.sec);
    if(left<=0) return res(); requestAnimationFrame(tick); }; tick(); });
  if(my!==runId) return;
  cimg.hidden=true; cover.hidden=false; $("#coverBig").textContent="?"; $("#coverSub").textContent="몇 마리였을까요?";
  $("#answer").hidden=false; renderAns(); $("#answer").scrollIntoView({block:"nearest"});
}
function setTimer(leftSec, total){
  const s=Math.ceil(leftSec-1e-9), low=leftSec<=3 && leftSec>0;
  $("#timeText").textContent=`${Math.max(0,s)}초`; $("#timeText").classList.toggle("low", low);
  $("#timeBar").style.width=`${Math.max(0,leftSec/total*100)}%`; $("#timeBarWrap").classList.toggle("low", low);
}
function renderAns(){ $("#ansView").textContent=P.input||" "; }
$("#pad").innerHTML=[1,2,3,4,5,6,7,8,9,"지우기",0,"확인"].map(v=>`<button type="button" data-k="${v}" class="${v==="확인"?"go":""}" ${v==="지우기"?'style="font-size:1rem"':""}>${v}</button>`).join("");
$("#pad").addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b||!P) return; const k=b.dataset.k;
  if(k==="지우기") P.input=P.input.slice(0,-1);
  else if(k==="확인") return submit();
  else if(P.input.length<2) P.input+=k;
  renderAns(); });
document.addEventListener("keydown", e=>{ if(!$("#s-play").classList.contains("on")||$("#answer").hidden) return;
  if(/^[0-9]$/.test(e.key)&&P.input.length<2){ P.input+=e.key; renderAns(); } else if(e.key==="Backspace"){ P.input=P.input.slice(0,-1); renderAns(); } else if(e.key==="Enter") submit(); });
async function submit(){
  if(!P.input) return toast("숫자를 입력해 주세요");
  const my=runId, L=LEVELS[P.lv];
  if(+P.input===P.answer){
    toast("정답!"); $("#answer").hidden=true; await wait(500); if(my!==runId) return;
    if(P.r<L.rounds.length-1){ P.r++; playRound(); }
    else {
      $("#clearTitle").textContent=`난이도 ${L.name} 클리어!`;
      $("#clearMsg").textContent = P.lv<3 ? `${L.rounds.length}라운드를 모두 맞혔어요. 찐융을 알아보는 눈이 있네요! 다음 난이도도 도전해 보세요.` : "최고 난이도까지 모두 맞혔어요. 당신이 진정한 찐융 감별사!";
      $("#btnNextLv").hidden = P.lv>=3;
      show("clear");
    }
  } else {
    $("#failMsg").innerHTML=`ROUND ${P.r+1}의 찐융은 <b>${P.answer}마리</b>였어요. 입력한 답은 ${esc(P.input)}마리예요.<br><span class="muted">다시 도전하면 새 배치가 나와요.</span>`;
    show("fail");
  }
}
$("#btnCount").onclick=startCount;
$("#btnRetry").onclick=startCount;
$("#btnCountAgain").onclick=startCount;
$("#btnNextLv").onclick=()=>{ if(S.lv<3){ S.lv++; save(); } startCount(); };

/* ===== 찐융 찾기 기록 도전 ===== */
renders.recform=()=>{
  const c=REC;
  $("#recRule").innerHTML=`${c.n}×${c.n} 배치에 숨은 찐융 <b>${c.target}마리</b>를 모두 눌러 찾아요. 다 찾을 때까지 걸린 시간이 기록이고, 짭융을 잘못 누르면 ${PENALTY}초가 더해져요.`;
  $("#fName").value=""; $("#fPhone").value=""; $("#fAgree").checked=false;
};
$("#btnRecord").onclick=()=>show("recform");
$("#fPhone").addEventListener("input", e=>{
  const d=e.target.value.replace(/\D/g,"").slice(0,11);
  e.target.value = d.length<4 ? d : d.length<8 ? `${d.slice(0,3)}-${d.slice(3)}` : `${d.slice(0,3)}-${d.slice(3,7)}-${d.slice(7)}`;
});
let RC=null, RC_INFO=null;
$("#btnRecStart").onclick=async()=>{
  const name=$("#fName").value.trim(), phone=$("#fPhone").value.replace(/\D/g,"");
  if(!name) return toast("이름을 입력해 주세요");
  if(!/^01\d{8,9}$/.test(phone)) return toast("전화번호를 확인해 주세요");
  if(!$("#fAgree").checked) return toast("동의에 체크해 주세요");
  RC_INFO={name, phone};
  await buildImages();
  startRecord();
};
async function startRecord(){
  const my=++runId, c=REC, cells=c.n*c.n;
  const kinds=shuffle(Array(cells).fill(null).map((_,i)=> i<c.target ? "real" : pick(c.pool)));
  RC={kinds, name:RC_INFO.name, phone:RC_INFO.phone, target:c.target, found:0, wrong:0, penalty:0, t0:0, done:false};
  show("recplay");
  const g=$("#recGrid"); g.className="grid tap"+(c.n>=10?" small":""); g.style.gridTemplateColumns=`repeat(${c.n},1fr)`;
  g.innerHTML=kinds.map((k,i)=>`<div class="cell" data-i="${i}"><img src="${k==="real"?IMG.real:IMG[k]}" alt=""></div>`).join("");
  $("#recLeft").textContent=`남은 찐융 ${c.target}마리`; $("#recClock").textContent="0.00초";
  $("#recCoverSub").textContent=`찐융 ${c.target}마리를 찾아요`;
  const cover=$("#recCover"); cover.hidden=false;
  for(const n of [3,2,1]){ $("#recCoverBig").textContent=n; await wait(650); if(my!==runId) return; }
  cover.hidden=true; RC.t0=performance.now();
  const step=()=>{ if(!RC||RC.done) return; $("#recClock").textContent=((performance.now()-RC.t0)/1000+RC.penalty).toFixed(2)+"초"; recRaf=requestAnimationFrame(step); };
  recRaf=requestAnimationFrame(step);
}
$("#recGrid").addEventListener("pointerdown", e=>{
  const cell=e.target.closest(".cell"); if(!cell||!RC||RC.done||!RC.t0) return;
  const i=+cell.dataset.i;
  if(RC.kinds[i]==="real"){ if(cell.classList.contains("ok")) return; cell.classList.add("ok"); RC.found++;
    $("#recLeft").textContent=`남은 찐융 ${RC.target-RC.found}마리`; if(RC.found===RC.target) finishRecord(); }
  else { RC.wrong++; RC.penalty+=PENALTY; toast(`짭융이에요 +${PENALTY}초`); cell.classList.add("no"); setTimeout(()=>cell.classList.remove("no"),400); }
});
function bestPerPerson(list){
  const seen=new Set(), out=[];
  for(const r of list){ const k=r.phone||r.name; if(seen.has(k)) continue; seen.add(k); out.push(r); }
  return out;
}
function maskName(n){ n=String(n); if(n.length<=1) return n; if(n.length===2) return n[0]+"*"; return n[0]+"*".repeat(n.length-2)+n[n.length-1]; }
function fmtPhone(p){ p=String(p||""); return p.length===11 ? `${p.slice(0,3)}-${p.slice(3,7)}-${p.slice(7)}` : p.length===10 ? `${p.slice(0,3)}-${p.slice(3,6)}-${p.slice(6)}` : p; }
function maskPhone(p){ p=String(p||""); return p ? "***-"+p.slice(-4) : ""; }
function rankRows(list, mePhone, full){
  const best=bestPerPerson(list);
  if(!best.length) return `<tr><td>아직 기록이 없어요</td></tr>`;
  const rows = full ? best : best.slice(0,10);
  return `<tr><th>순위</th><th>이름</th><th>전화번호</th><th>기록</th></tr>`+rows.map((r,i)=>`<tr class="${mePhone&&r.phone===mePhone?"me":""}"><td>${i+1}</td><td>${esc(full?r.name:maskName(r.name))}</td><td>${esc(full?fmtPhone(r.phone):maskPhone(r.phone))}</td><td>${r.secs.toFixed(2)}초</td></tr>`).join("");
}
function finishRecord(){
  RC.done=true; cancelAnimationFrame(recRaf);
  const secs=Math.round(((performance.now()-RC.t0)/1000+RC.penalty)*100)/100, at=Date.now();
  const list=S.board;
  list.push({name:RC.name, phone:RC.phone, secs, wrong:RC.wrong, at});
  list.sort((a,b)=>a.secs-b.secs||a.at-b.at); S.board=list.slice(0,300); save();
  const best=bestPerPerson(S.board); const me=best.find(r=>r.phone===RC.phone); const rank=best.indexOf(me)+1;
  $("#recTime").textContent=secs.toFixed(2)+"초";
  $("#recTitle").textContent = (rank===1 && me.at===at) ? "새로운 1위 기록이에요!" : `내 순위 ${rank}위`;
  $("#recDetail").textContent=`잘못 누른 짭융 ${RC.wrong}회(+${RC.wrong*PENALTY}초) 포함`;
  $("#recTable").innerHTML=rankRows(S.board, RC.phone, false);
  show("recres");
}
$("#btnRecAgain").onclick=async()=>{ if(!RC_INFO) return show("recform"); await buildImages(); startRecord(); };

/* ===== 순위 ===== */
let resetArm=0, adminOn=false;
renders.rank=()=>{
  $("#rankTable").innerHTML=rankRows(S.board, null, adminOn);
  $("#btnReset").hidden=!adminOn; $("#btnReset").textContent="기록 지우기";
  $("#btnAdmin").textContent=adminOn?"가리기":"연락처 보기";
};
$("#btnRank").onclick=()=>{ adminOn=false; $("#aPin").value=""; show("rank"); };
$("#btnAdmin").onclick=()=>{
  if(adminOn){ adminOn=false; $("#aPin").value=""; return renders.rank(); }
  if($("#aPin").value.trim()!==ADMIN_PIN) return toast("PIN이 맞지 않아요");
  adminOn=true; renders.rank();
};
$("#btnReset").onclick=()=>{
  if(!adminOn) return;
  const now=Date.now();
  if(now-resetArm>3000){ resetArm=now; $("#btnReset").textContent="한 번 더 누르면 지워져요"; return; }
  S.board=[]; save(); resetArm=0; toast("기록을 지웠어요"); renders.rank();
};

buildImages();
show("home");
</script>
</body>
</html>
