<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B · Hello, World! 코딩 체험 · 2026 KW Epilogue: AI Booth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/common.css">

<style>
  :root{
    --card:var(--surface);
    --accent:var(--blue); --accent-dark:#2E49B3; --accent-soft:var(--blue-soft);
    --warn:#9A6400; --warn-soft:#FFF3D1;
    --editor:#0E1838; --editor-line:#1A2756; --editor-text:#E6EBFF; --editor-dim:#6B78A8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  .wrap{max-width:980px;margin:0 auto;padding:24px 20px 48px}
  header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}
  .brand{display:flex;flex-direction:column;gap:2px}
  .brand small{font-size:13px;font-weight:700;color:var(--accent)}
  .brand b{font-size:20px;font-weight:900;letter-spacing:-.3px}
  .ghost{background:transparent;border:1.5px solid var(--line);color:var(--muted);border-radius:10px;padding:10px 14px;font-size:14px;font-weight:700;min-height:44px}
  .ghost:hover{border-color:var(--muted);color:var(--ink)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px}
  h1{font-size:40px;line-height:1.2;margin:0 0 10px;font-weight:900;letter-spacing:-1px}
  h2{font-size:18px;margin:0 0 12px;font-weight:900}
  .lead{font-size:16px;color:var(--muted);line-height:1.7;margin:0 0 28px}
  .step{margin-bottom:28px}
  .step-label{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .num{width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:900}
  .grid{display:grid;gap:12px}
  .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
  @media (max-width:760px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}h1{font-size:30px}}
  .opt{text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px;min-height:96px;transition:border-color .15s,background .15s}
  .opt:hover{border-color:#93C5FD}
  .opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
  .opt .t{font-size:19px;font-weight:900;color:var(--ink)}
  .opt .t code{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;color:var(--accent-dark);margin-left:6px}
  .opt .d{font-size:13.5px;color:var(--muted);line-height:1.5}
  .lv{font-size:13px;font-weight:900;border-radius:999px;padding:2px 10px;align-self:flex-start}
  .lv1{background:var(--ok-soft);color:var(--ok)}
  .lv2{background:var(--warn-soft);color:var(--warn)}
  .lv3{background:var(--bad-soft);color:var(--bad)}
  .primary{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:14px 24px;font-size:17px;font-weight:900;min-height:52px}
  .primary:hover{background:var(--accent-dark)}
  .primary:disabled{background:#CBD5E1;color:#fff;cursor:not-allowed}
  .secondary{background:#fff;color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:12px 18px;font-size:15px;font-weight:700;min-height:48px}
  .secondary:hover{border-color:var(--muted)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .spacer{flex:1}

  /* problem */
  .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .chip{font-size:13px;font-weight:700;border-radius:999px;padding:4px 12px;background:#fff;border:1px solid var(--line)}
  .dots{display:flex;gap:6px;margin-left:auto}
  .dot{width:34px;height:8px;border-radius:999px;background:var(--line)}
  .dot.done{background:var(--ok)}
  .dot.now{background:var(--accent)}
  .ptitle{font-size:26px;font-weight:900;margin:0 0 8px;letter-spacing:-.4px}
  .pdesc{font-size:16px;line-height:1.75;color:#1E293B;margin:0 0 16px}
  .target{display:flex;gap:12px;align-items:flex-start;background:#F8FAFC;border:1px dashed #94A3B8;border-radius:12px;padding:12px 14px;margin-bottom:16px}
  .target b{font-size:13px;white-space:nowrap;padding-top:2px}
  .target pre{margin:0;font-family:'JetBrains Mono',monospace;font-size:14px;line-height:1.55;white-space:pre-wrap}

  .editor{background:var(--editor);border-radius:14px;overflow:hidden}
  .editor-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--editor-line);color:#CBD5E1;font-size:13px;font-family:'JetBrains Mono',monospace}
  .editor-bar .lights{display:flex;gap:6px;margin-right:6px}
  .editor-bar .lights i{width:10px;height:10px;border-radius:50%;background:#475569;display:block}
  .code{padding:14px 0;font-family:'JetBrains Mono',monospace;font-size:17px;line-height:2;color:var(--editor-text);overflow-x:auto}
  .ln{display:flex;white-space:pre;min-height:34px;align-items:center}
  .ln .no{width:48px;flex:none;text-align:right;padding-right:16px;color:#64748B;user-select:none;font-size:14px}
  .ln .src{padding-right:20px}
  .ln.dim .src{color:var(--editor-dim)}
  .blank{font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:700;color:#FDE68A;background:#1E293B;border:0;border-bottom:2.5px solid #FACC15;border-radius:6px 6px 0 0;padding:2px 6px;margin:0 2px;outline:none;text-align:center;caret-color:#FDE68A}
  .blank:focus{background:#334155;box-shadow:0 0 0 2px #60A5FA}
  .blank.ok{color:#86EFAC;border-bottom-color:#22C55E;background:#14532D}
  .blank.bad{color:#FCA5A5;border-bottom-color:#EF4444;background:#450A0A}
  .blank.ok:disabled{opacity:1}
  .str{color:#FCA5A5}
  .kw{color:#93C5FD}
  .com{color:#64748B}

  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
  .hint{margin-top:14px;background:var(--warn-soft);border:1px solid #FCD34D;border-radius:12px;padding:14px 16px;font-size:15px;line-height:1.7;color:#78350F}
  .hint b{color:#92400E}
  .terminal{margin-top:16px;background:#020617;border-radius:14px;padding:14px 18px;font-family:'JetBrains Mono',monospace;font-size:15px;line-height:1.7;color:#E2E8F0;min-height:84px}
  .terminal .label{font-size:12px;color:#94A3B8;margin-bottom:6px;font-family:'Gowun Dodum',sans-serif;font-weight:700}
  .terminal .out{white-space:pre-wrap;color:#F8FAFC}
  .terminal .err{color:#FCA5A5}
  .terminal .tip{color:#FDE68A;font-family:'Gowun Dodum',sans-serif;font-size:14.5px;margin-top:6px}
  .terminal .yay{color:#86EFAC;font-family:'Gowun Dodum',sans-serif;font-weight:700;margin-top:8px}
  .cursor{display:inline-block;width:8px;height:17px;background:#E2E8F0;vertical-align:-3px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  /* finish */
  .finish{text-align:center;padding:44px 28px}
  .medal{width:112px;height:112px;margin:0 auto 18px;border-radius:50%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center}
  .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:520px;margin:24px auto 28px}
  .stat{background:#F8FAFC;border:1px solid var(--line);border-radius:12px;padding:14px}
  .stat b{display:block;font-size:26px;font-weight:900}
  .stat span{font-size:13px;color:var(--muted)}
  .center{justify-content:center}
  .foot{margin-top:18px;font-size:13px;color:var(--muted);text-align:center}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

  /* ===== 부스 공통 스타일 덮어쓰기 ===== */
  html,body{font-family:"Gowun Dodum","Apple SD Gothic Neo",system-ui,sans-serif}
  body{background:var(--bg) radial-gradient(1200px 380px at 50% -120px,var(--blue-soft),transparent) no-repeat}
  h1,h2,.ptitle,.brand b,.opt .t,.primary,.secondary,.ghost,.num,.lv,.chip,.stat b{font-family:"Jua",sans-serif!important;font-weight:400!important;letter-spacing:0}
  .brand small{color:var(--violet)}
  .card{border:2.5px solid var(--line);border-radius:22px;box-shadow:0 4px 0 var(--line)}
  .opt{background:var(--surface);border:2.5px solid var(--line);box-shadow:0 3px 0 var(--line);border-radius:16px}
  .opt:hover{border-color:var(--blue)}
  .opt[aria-pressed="true"]{background:var(--blue-soft);border-color:var(--blue);box-shadow:0 3px 0 var(--blue)}
  .opt .d,.lead,.pdesc{color:var(--muted)}
  .opt .t,.ptitle,.stat b{color:var(--ink)}
  .num{background:var(--grad)}
  .lv1{background:var(--ok-soft);color:var(--ok)} .lv2{background:var(--blue-soft);color:var(--blue)} .lv3{background:var(--violet-soft);color:var(--violet)}
  .primary{background:var(--grad);border:2.5px solid var(--line);border-radius:999px;box-shadow:0 3px 0 var(--line)}
  .primary:hover{background:var(--grad);filter:brightness(1.06)}
  .primary:disabled{background:var(--soft);color:var(--muted);box-shadow:none;border-color:var(--soft)}
  .secondary,.ghost{background:var(--surface);color:var(--ink);border:2.5px solid var(--line);border-radius:999px;box-shadow:0 3px 0 var(--line)}
  .primary:active,.secondary:active,.ghost:active,.opt:active{transform:translateY(3px);box-shadow:none}
  .chip{background:var(--surface);border:2px solid var(--line);color:var(--ink)}
  .dot{background:var(--soft)} .dot.now{background:var(--violet)}
  .target{background:var(--surface);border:2px dashed var(--muted);color:var(--ink)}
  .pdesc b{color:var(--blue)}
  .hint{border:2px solid #E9B949}
  .stat{background:var(--surface);border:2px solid var(--line)}
  .medal{width:auto;height:auto;background:none;border-radius:0}
  .medal img{width:min(60%,240px);height:auto}
  .foot{color:var(--muted)}
</style>
</head>

const app = document.getElementById('app');
let S = {};
function reset(){ S = {lang:null, level:null, idx:0, hints:0, reveals:0, tries:0}; renderStart(); }
document.getElementById('homeBtn').addEventListener('click', reset);

const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const norm = s => s.replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/；/g,';').replace(/\s+/g,'');

function renderStart(){
  const langBtns = Object.entries(LANGS).map(([k,v])=>
    `<button type="button" class="opt" data-lang="${k}" aria-pressed="${S.lang===k}"><span class="t">${v.name}</span><span class="d">${v.desc}</span></button>`).join('');
  const lvBtns = Object.entries(LEVELS).map(([k,v])=>
    `<button type="button" class="opt" data-level="${k}" aria-pressed="${String(S.level)===k}"><span class="lv ${v.cls}">${v.name}</span><span class="t">${v.title}</span><span class="d">${v.desc}</span></button>`).join('');
  app.innerHTML = `
  <section class="card">
    <h1>빈칸을 채우면<br>프로그램이 돌아가요!</h1>
    <p class="lead">진짜 코드에서 비어 있는 부분을 직접 입력해 보세요. 문제는 3개이고, 막히면 힌트를 볼 수 있어요.</p>
    <div class="step"><div class="step-label"><span class="num">1</span><h2 style="margin:0">언어를 골라요</h2></div><div class="grid g4">${langBtns}</div></div>
    <div class="step"><div class="step-label"><span class="num">2</span><h2 style="margin:0">난이도를 골라요</h2></div><div class="grid g3">${lvBtns}</div></div>
    <div class="row"><span class="spacer"></span><button type="button" class="primary" id="startBtn" ${S.lang&&S.level?'':'disabled'}>시작하기</button></div>
  </section>`;
  app.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{S.lang=b.dataset.lang; renderStart();}));
  app.querySelectorAll('[data-level]').forEach(b=>b.addEventListener('click',()=>{S.level=+b.dataset.level; renderStart();}));
  document.getElementById('startBtn').addEventListener('click',()=>{S.idx=0;S.hints=0;S.reveals=0;S.tries=0;renderProblem();});
}

function highlight(text, lang){
  // text is raw; returns escaped html with simple coloring
  let out = '', i = 0;
  const kws = LANGS[lang].kw;
  while(i < text.length){
    const ch = text[i];
    if(ch === '"'){ let j = text.indexOf('"', i+1); if(j<0) j = text.length-1; out += `<span class="str">${esc(text.slice(i,j+1))}</span>`; i = j+1; continue; }
    if(/[A-Za-z_#]/.test(ch)){ let j=i; while(j<text.length && /[A-Za-z0-9_#]/.test(text[j])) j++; const w=text.slice(i,j); const bare=w.replace('#',''); out += kws.includes(bare) ? `<span class="kw">${esc(w)}</span>` : esc(w); i=j; continue; }
    out += esc(ch); i++;
  }
  return out;
}

function renderProblem(){
  const L = LANGS[S.lang], lv = LEVELS[S.level], list = P[S.lang][S.level], p = list[S.idx];
  let lines = p.c.split('\n');
  let html = '', no = 1;
  const addLine = (src, dim) => { html += `<div class="ln${dim?' dim':''}"><span class="no">${no++}</span><span class="src">${src}</span></div>`; };
  if(L.wrap) L.wrap.pre.forEach(l=>addLine(highlight(l,S.lang), true));
  lines.forEach(line=>{
    const full = (L.wrap?L.wrap.indent:'') + line;
    const parts = full.split(/(\{\{\d+\}\})/);
    const src = parts.map(part=>{
      const m = part.match(/^\{\{(\d+)\}\}$/);
      if(m){ const k=+m[1]; const w=Math.max(3, ...p.a[k].map(x=>x.length))+1; return `<input class="blank" data-k="${k}" style="width:${w+1.5}ch" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="빈칸 ${k+1}">`; }
      return highlight(part, S.lang);
    }).join('');
    addLine(src, false);
  });
  if(L.wrap) L.wrap.post.forEach(l=>addLine(highlight(l,S.lang), true));

  const dots = list.map((_,i)=>`<span class="dot ${i<S.idx?'done':i===S.idx?'now':''}"></span>`).join('');
  app.innerHTML = `
  <section class="card">
    <div class="meta"><span class="chip">${L.name}</span><span class="lv ${lv.cls}">난이도 ${lv.name}</span><span class="chip">문제 ${S.idx+1} / ${list.length}</span><span class="dots" aria-hidden="true">${dots}</span></div>
    <h2 class="ptitle">${p.t}</h2>
    <p class="pdesc">${p.d}</p>
    <div class="target"><b>목표 출력</b><pre>${esc(p.o)}</pre></div>
    <div class="editor">
      <div class="editor-bar"><span class="lights"><i></i><i></i><i></i></span>${L.file}${L.wrap?'<span style="margin-left:auto;color:#94A3B8;font-family:Gowun Dodum,sans-serif">흐린 줄은 기본 틀이라 그대로 두면 돼요</span>':''}</div>
      <div class="code">${html}</div>
    </div>
    <div class="actions">
      <button type="button" class="primary" id="runBtn">▶ 실행하기</button>
      <button type="button" class="secondary" id="hintBtn">힌트 보기</button>
      <button type="button" class="secondary" id="revealBtn" hidden>정답 보기</button>
      <span class="spacer"></span>
      <button type="button" class="secondary" id="nextBtn" hidden>${S.idx<list.length-1?'다음 문제 →':'결과 보기 →'}</button>
    </div>
    <div id="hintBox"></div>
    <div class="terminal" id="term"><div class="label">실행 결과</div><span class="cursor"></span></div>
  </section>
  <p class="foot">Enter를 눌러도 실행돼요 · 빈칸이 여러 개면 Tab으로 옮겨 다닐 수 있어요</p>`;

  const inputs = [...app.querySelectorAll('.blank')];
  inputs[0] && inputs[0].focus();
  inputs.forEach(inp=>{
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); run(); }});
    inp.addEventListener('input',()=>inp.classList.remove('bad'));
  });
  let hintShown = false, solved = false;
  document.getElementById('runBtn').addEventListener('click', run);
  document.getElementById('hintBtn').addEventListener('click', ()=>{
    if(!hintShown){ S.hints++; hintShown = true; }
    document.getElementById('hintBox').innerHTML = `<div class="hint"><b>힌트</b> · ${p.h}</div>`;
    document.getElementById('revealBtn').hidden = solved;
  });
  document.getElementById('revealBtn').addEventListener('click', ()=>{
    S.reveals++;
    inputs.forEach(inp=>{ inp.value = p.a[+inp.dataset.k][0]; inp.classList.remove('bad'); });
    document.getElementById('revealBtn').hidden = true;
    inputs[0].focus();
  });
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    if(S.idx < list.length-1){ S.idx++; renderProblem(); } else renderFinish();
  });

  function run(){
    if(solved) return;
    S.tries++;
    const term = document.getElementById('term');
    let wrong = 0, empty = 0, caseOnly = 0;
    inputs.forEach(inp=>{
      const v = norm(inp.value), ok = p.a[+inp.dataset.k].map(norm);
      if(!v){ empty++; wrong++; inp.classList.add('bad'); return; }
      if(ok.includes(v)){ inp.classList.remove('bad'); inp.classList.add('ok'); }
      else { wrong++; inp.classList.add('bad'); inp.classList.remove('ok'); if(ok.some(x=>x.toLowerCase()===v.toLowerCase())) caseOnly++; }
    });
    if(wrong === 0){
      solved = true;
      inputs.forEach(inp=>inp.disabled = true);
      document.getElementById('runBtn').disabled = true;
      document.getElementById('hintBtn').hidden = true;
      document.getElementById('revealBtn').hidden = true;
      const out = p.o.split('\n');
      term.innerHTML = '<div class="label">실행 결과</div><div class="out" id="outText"></div>';
      const box = document.getElementById('outText');
      let i = 0;
      (function tick(){
        if(i < out.length){ box.textContent += (i?'\n':'') + out[i]; i++; setTimeout(tick, 220); }
        else {
          term.insertAdjacentHTML('beforeend', `<div class="yay">성공! 프로그램이 제대로 실행됐어요.</div>`);
          const nb = document.getElementById('nextBtn'); nb.hidden = false; nb.focus();
        }
      })();
    } else {
      let tip = '빨간 칸을 다시 확인해 보세요.';
      if(empty) tip = '아직 비어 있는 칸이 있어요.';
      else if(caseOnly) tip = '거의 다 왔어요! 대문자와 소문자를 확인해 보세요. 컴퓨터는 둘을 다른 글자로 봐요.';
      if(inputs.length>1) tip += ` (${inputs.length}칸 중 ${inputs.length-wrong}칸 정답)`;
      if(!hintShown) tip += ' 막히면 힌트를 눌러 보세요.';
      term.innerHTML = `<div class="label">실행 결과</div><div class="err">${esc(L.err)}</div><div class="tip">${tip}</div>`;
      const firstBad = inputs.find(x=>x.classList.contains('bad')); firstBad && firstBad.focus();
    }
  }
}

function renderFinish(){
  const L = LANGS[S.lang], lv = LEVELS[S.level];
  const perfect = S.hints===0 && S.reveals===0;
  const nextLv = S.level < 3 ? S.level+1 : null;
  app.innerHTML = `
  <section class="card finish">
    <div class="medal"><img src="../assets/img/koyung-sw.webp" alt="노트북으로 코딩하는 코융이"></div>
    <h1>${L.name} ${lv.name} 단계 완료!</h1>
    <p class="lead" style="margin-bottom:0">${perfect?'힌트 없이 전부 풀었어요. 개발자 소질이 보이는데요?':'끝까지 해냈어요! 방금 직접 코드를 완성해서 프로그램을 실행한 거예요.'}</p>
    <div class="stats">
      <div class="stat"><b>3</b><span>푼 문제</span></div>
      <div class="stat"><b>${S.hints}</b><span>힌트 사용</span></div>
      <div class="stat"><b>${S.reveals}</b><span>정답 보기</span></div>
    </div>
    <div class="row center">
      ${nextLv?`<button type="button" class="primary" id="upBtn">난이도 ${LEVELS[nextLv].name} 도전하기</button>`:''}
      <button type="button" class="secondary" id="otherBtn">다른 언어로 해보기</button>
      <button type="button" class="secondary" id="homeBtn2">처음으로</button>
    </div>
  </section>`;
  if(nextLv) document.getElementById('upBtn').addEventListener('click',()=>{S.level=nextLv;S.idx=0;S.hints=0;S.reveals=0;renderProblem();});
  document.getElementById('otherBtn').addEventListener('click',()=>{S.lang=null;renderStart();});
  document.getElementById('homeBtn2').addEventListener('click',reset);
}

reset();
})();
